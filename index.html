<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>MediaPipe Tracker – Dynamic Island Fixed</title>

<style>
:root {
  --bg: #0f0f1a;
  --panel: rgba(30, 30, 50, 0.78);
  --accent: #00d4ff;
  --text: #f0f4ff;

  /* Realistic Dynamic Island size */
  --island-width: 160px;
  --island-height: 38px;

  --bottom-inset: env(safe-area-inset-bottom, 34px);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}

#video, #canvas {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#canvas { pointer-events:none; }

/* ---------------- DYNAMIC ISLAND ---------------- */

#island-zone {
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  width:var(--island-width);
  height:var(--island-height);
  z-index:120;
  pointer-events:auto;
}

#island-outline {
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  width:var(--island-width);
  height:var(--island-height);
  border-radius:999px;
  border:2px solid var(--accent);
  box-shadow:
    0 0 20px rgba(0,212,255,0.5),
    inset 0 0 10px rgba(0,212,255,0.4);
  pointer-events:none;
  z-index:110;
  opacity:.75;
  transition:.35s ease;
}

#island-outline.menu-open {
  opacity:1;
  box-shadow:
    0 0 36px var(--accent),
    inset 0 0 18px rgba(0,212,255,.7);
}

#island-outline.hidden { opacity:0; }

/* ---------------- HUD ---------------- */

#hud {
  position:fixed;
  top:calc(var(--island-height) + 20px);
  left:10px;
  right:10px;
  z-index:90;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.hud-card {
  background:rgba(20,20,40,.85);
  backdrop-filter:blur(12px);
  border:1px solid rgba(0,212,255,.2);
  border-radius:12px;
  padding:8px 12px;
  font-size:12px;
  text-align:center;
}

.hud-card b { color:var(--accent); }

/* ---------------- CONTROL PANEL ---------------- */

#controls-panel {
  position:fixed;
  top:calc(var(--island-height) + 20px);
  right:10px;
  z-index:100;
  background:var(--panel);
  backdrop-filter:blur(16px);
  border:1px solid rgba(0,212,255,.4);
  border-radius:16px;
  padding:14px 16px;
  width:240px;
  max-height:calc(100vh - var(--island-height) - 80px);
  overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.7);
  transition:.35s ease;
}

#controls-panel.hidden {
  opacity:0;
  transform:translateY(-40px);
  pointer-events:none;
}

#controls-panel h3 {
  margin-bottom:12px;
  text-align:center;
}

#controls-panel label {
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
  font-size:13px;
}

input[type=checkbox] {
  transform:scale(1.3);
  accent-color:var(--accent);
}

input[type=range] {
  width:100%;
  accent-color:var(--accent);
}

select {
  padding:7px 10px;
  border-radius:8px;
  background:#1a1a2e;
  color:var(--text);
  border:1px solid #334466;
  width:100%;
}

/* ---------------- STATUS ---------------- */

#status {
  position:fixed;
  bottom:calc(var(--bottom-inset) + 12px);
  left:50%;
  transform:translateX(-50%);
  background:rgba(20,20,40,.9);
  backdrop-filter:blur(12px);
  padding:8px 18px;
  border-radius:999px;
  border:1px solid rgba(0,180,255,.3);
  font-size:14px;
  white-space:nowrap;
  z-index:90;
}

#status.faded { opacity:0; transition:1.5s; }

</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="island-zone"></div>
<div id="island-outline"></div>

<div id="hud">
  <div class="hud-card">FPS: <b id="fps">--</b></div>
  <div class="hud-card">
    Objects: <b id="objCount">0</b> · Faces: <b id="faceCount">0</b><br>
    Hands: <b id="handCount">0</b> · Poses: <b id="poseCount">0</b>
  </div>
</div>

<div id="controls-panel" class="hidden">
  <h3>Tracker Controls</h3>
  <label><input type="checkbox" id="faceDetect" checked> Face boxes</label>
  <label><input type="checkbox" id="faceMesh" checked> Face mesh</label>
  <label><input type="checkbox" id="objDetect" checked> Objects</label>
  <label><input type="checkbox" id="poseLand" checked> Body pose</label>
  <label><input type="checkbox" id="handLand" checked> Hands</label>
  <label><input type="checkbox" id="segment"> Segmentation</label>

  <hr style="margin:14px 0; border-color:#334466;">

  <label>Camera
    <select id="camera">
      <option value="user">Front</option>
      <option value="environment">Back</option>
    </select>
  </label>

  <label>
    Detection confidence
    <input type="range" id="conf" min="30" max="70" value="50">
    <span id="confVal">0.50</span>
  </label>
</div>

<div id="status">Initializing…</div>

<script type="module">
import {
  FilesetResolver, HandLandmarker, PoseLandmarker,
  ObjectDetector, FaceDetector, FaceLandmarker,
  ImageSegmenter, DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const islandZone = document.getElementById("island-zone");
const islandOutline = document.getElementById("island-outline");
const controlsPanel = document.getElementById("controls-panel");

islandZone.addEventListener("click", () => {
  const open = controlsPanel.classList.contains("hidden");
  controlsPanel.classList.toggle("hidden", !open);
  islandOutline.classList.toggle("menu-open", open);
});
</script>

</body>
</html>
