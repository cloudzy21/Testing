<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>MediaPipe Tracker – Dynamic Island Tap</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --panel: rgba(30, 30, 50, 0.75);
      --accent: #00d4ff;
      --text: #f0f4ff;
      --island-height: env(safe-area-inset-top, 59px);
      --bottom-inset: env(safe-area-inset-bottom, 34px);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height:100%; overflow:hidden; background:var(--bg); color:var(--text);
      font-family:system-ui, -apple-system, sans-serif; touch-action:manipulation;
    }
    #video, #canvas {
      position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    }
    #canvas { pointer-events:none; }

    #hud {
      position:fixed; top:calc(var(--island-height) + 12px); left:12px; z-index:90;
      pointer-events:none;
    }
    .hud-card {
      background:rgba(20,20,40,0.8); backdrop-filter:blur(10px);
      border:1px solid rgba(100,180,255,0.25); border-radius:10px;
      padding:8px 12px; font-size:13px; margin-bottom:6px;
      box-shadow:0 3px 12px rgba(0,0,0,0.5);
    }

    #controls-wrapper {
      position:fixed; top:calc(var(--island-height) + 12px); right:12px; z-index:100;
    }
    #controls-toggle {
      width:48px; height:48px; border-radius:50%;
      background:var(--panel); backdrop-filter:blur(12px);
      border:1px solid var(--accent); color:var(--accent);
      font-size:24px; font-weight:bold;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,0.6);
      transition:all 0.25s ease;
    }
    #controls-toggle:hover { transform:scale(1.08); }
    #controls-toggle.minimized { background:rgba(40,40,70,0.9); }

    #controls-panel {
      background:var(--panel); backdrop-filter:blur(16px);
      border:1px solid rgba(0,212,255,0.35); border-radius:16px;
      padding:16px 18px; margin-top:12px; width:260px;
      max-height:calc(100vh - var(--island-height) - 100px); overflow-y:auto;
      box-shadow:0 10px 40px rgba(0,0,0,0.7);
      transition:opacity 0.3s ease, transform 0.3s ease;
    }
    #controls-panel.hidden {
      opacity:0; transform:translateY(-20px); pointer-events:none;
    }

    #controls-panel h3 { margin:0 0 14px; font-size:17px; }
    #controls-panel label { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:14px; cursor:pointer; }
    input[type=checkbox] { transform:scale(1.35); accent-color:var(--accent); }
    input[type=range] { width:100%; accent-color:var(--accent); }
    select { padding:8px 12px; border-radius:8px; background:#1a1a2e; color:var(--text); border:1px solid #334466; width:100%; }

    #status {
      position:fixed; bottom:calc(var(--bottom-inset) + 16px); left:50%; transform:translateX(-50%);
      background:rgba(20,20,40,0.85); backdrop-filter:blur(12px);
      padding:10px 24px; border-radius:999px; border:1px solid rgba(0,180,255,0.3);
      font-size:15px; white-space:nowrap; transition:opacity 1.5s; pointer-events:none; z-index:90;
    }
    #status.faded { opacity:0; }

    /* Dynamic Island tap zone + outline */
    #island-zone {
      position:fixed; top:0; left:50%; transform:translateX(-50%);
      width:160px; height:var(--island-height);
      pointer-events:auto; z-index:85;
      cursor:pointer;
    }
    #island-outline {
      position:fixed; top:0; left:50%; transform:translateX(-50%);
      width:140px; height:var(--island-height);
      pointer-events:none; z-index:80;
      border-bottom:2px solid var(--accent);
      border-left:1px solid var(--accent); border-right:1px solid var(--accent);
      border-radius:0 0 28px 28px;
      background:linear-gradient(to bottom, rgba(0,212,255,0.12), transparent);
      opacity:0.7; transition:opacity 0.6s;
    }
    #island-outline.menu-open { opacity:1; }
    #island-outline.hidden { opacity:0; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="island-zone" onclick="toggleControls()"></div>
  <div id="island-outline"></div>

  <div id="hud">
    <div class="hud-card">FPS: <b id="fps">--</b></div>
    <div class="hud-card">
      Objects: <b id="objCount">0</b> · Faces: <b id="faceCount">0</b><br>
      Hands: <b id="handCount">0</b> · Poses: <b id="poseCount">0</b>
    </div>
  </div>

  <div id="controls-wrapper">
    <div id="controls-toggle" onclick="toggleControls()">–</div>
    <div id="controls-panel">
      <h3>Tracker Controls</h3>
      <label><input type="checkbox" id="faceDetect" checked> Face boxes</label>
      <label><input type="checkbox" id="faceMesh" checked> Detailed face mesh</label>
      <label><input type="checkbox" id="objDetect" checked> Objects & people</label>
      <label><input type="checkbox" id="poseLand" checked> Body skeleton</label>
      <label><input type="checkbox" id="handLand" checked> Detailed hands</label>
      <label><input type="checkbox" id="segment"> Person mask overlay</label>

      <hr style="margin:16px 0; border-color:#334466;">

      <label>Camera
        <select id="camera">
          <option value="user" selected>Front (selfie)</option>
          <option value="environment">Back</option>
        </select>
      </label>

      <label>
        Detection confidence
        <input type="range" id="conf" min="30" max="70" value="50" step="1">
        <span id="confVal">0.50</span>
      </label>
    </div>
  </div>

  <div id="status">Initializing models…</div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker,
      PoseLandmarker,
      ObjectDetector,
      FaceDetector,
      FaceLandmarker,
      ImageSegmenter,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const islandOutline = document.getElementById("island-outline");
    const controlsPanel = document.getElementById("controls-panel");
    const controlsToggle = document.getElementById("controls-toggle");

    let detectors = {};
    let running = false;
    const drawUtils = new DrawingUtils(ctx);

    const state = {
      faceDetect: true,
      faceMesh: true,
      objDetect: true,
      poseLand: true,
      handLand: true,
      segment: false,
      facingMode: "user",
      confidence: 0.50
    };

    // Toggle controls (called by island tap or round button)
    function toggleControls() {
      controlsPanel.classList.toggle("hidden");
      controlsToggle.textContent = controlsPanel.classList.contains("hidden") ? "+" : "–";
      controlsToggle.classList.toggle("minimized", controlsPanel.classList.contains("hidden"));
      islandOutline.classList.toggle("menu-open", !controlsPanel.classList.contains("hidden"));
    }

    // Bind other controls
    document.querySelectorAll('#controls-panel input[type=checkbox]').forEach(el => {
      el.onchange = () => state[el.id] = el.checked;
    });

    document.getElementById("conf").oninput = e => {
      state.confidence = e.target.value / 100;
      document.getElementById("confVal").textContent = state.confidence.toFixed(2);
      updateDetectorOptions();
    };

    document.getElementById("camera").onchange = e => {
      state.facingMode = e.target.value;
      restartCamera();
    };

    async function startCamera() {
      // ... (same as before)
      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        islandOutline.classList.toggle("hidden", state.facingMode !== "user");
        status.textContent = "Tracking active";
        running = true;
        requestAnimationFrame(predictLoop);
      };
    }

    function restartCamera() {
      running = false;
      islandOutline.classList.add("hidden");

    }

    initModels().catch(err => {
      status.textContent = "Init failed: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
