<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tracker Debug v2 - Hands/Body/Objects/Faces</title>
  <style>
    body { margin:0; background:#000; font-family:Arial, sans-serif; color:#fff; overflow:hidden; }
    #container { position:relative; width:100vw; height:100vh; }
    #video, #canvas { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
    #canvas { pointer-events:none; }
    #controls {
      position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); padding:12px; border-radius:8px;
      z-index:20; font-size:14px; max-width:240px; overflow-y:auto; max-height:80vh;
    }
    #controls label { display:block; margin:6px 0; }
    #status { position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.7); padding:8px 12px; border-radius:6px; z-index:10; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="controls">
      <strong>Debug Controls</strong><br>
      <label><input type="checkbox" id="faceOn" checked> Faces</label>
      <label><input type="checkbox" id="objOn" checked> Objects</label>
      <label><input type="checkbox" id="poseOn" checked> Body</label>
      <label><input type="checkbox" id="handOn" checked> Hands</label>
      <label>Camera: <select id="cameraMode"><option value="user">Front</option><option value="environment">Back</option></select></label>
      <hr>
      <small>Open Safari → Develop → [Your Device] → localhost → Inspect to see console logs</small>
    </div>
    <div id="status">Initializing...</div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker,
      PoseLandmarker,
      ObjectDetector,
      FaceDetector,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    let handLandmarker, poseLandmarker, objectDetector, faceDetector;
    let running = false;
    const drawingUtils = new DrawingUtils(ctx);

    const settings = {
      faces: true, objects: true, pose: true, hands: true,
      facingMode: "user",
      faceThreshold: 0.5, objThreshold: 0.4, detThreshold: 0.5
    };

    // Quick toggle listeners (no sliders for debug speed)
    document.getElementById("faceOn").onchange = e => settings.faces = e.target.checked;
    document.getElementById("objOn").onchange = e => settings.objects = e.target.checked;
    document.getElementById("poseOn").onchange = e => settings.pose = e.target.checked;
    document.getElementById("handOn").onchange = e => settings.hands = e.target.checked;
    document.getElementById("cameraMode").onchange = e => {
      settings.facingMode = e.target.value;
      restartCamera();
    };

    async function initialize() {
      status.textContent = "Loading WASM...";
      console.log("Starting WASM load");
      let vision;
      try {
        vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        console.log("WASM loaded");
      } catch (e) {
        status.textContent = "WASM failed: " + e.message;
        console.error("WASM error", e);
        return;
      }

      try {
        status.textContent = "Loading Face...";
        faceDetector = await FaceDetector.createFromOptions(vision, {
          baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite" },
          runningMode: "VIDEO", minDetectionConfidence: settings.faceThreshold
        });
        console.log("Face model loaded");
      } catch (e) { console.error("Face load fail", e); }

      try {
        status.textContent = "Loading Hands...";
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
          runningMode: "VIDEO", numHands: 2,
          minHandDetectionConfidence: settings.detThreshold, minTrackingConfidence: settings.detThreshold
        });
        console.log("Hands loaded");
      } catch (e) { console.error("Hands load fail", e); }

      try {
        status.textContent = "Loading Pose...";
        poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" },
          runningMode: "VIDEO", numPoses: 2,
          minPoseDetectionConfidence: settings.detThreshold
        });
        console.log("Pose loaded");
      } catch (e) { console.error("Pose load fail", e); }

      try {
        status.textContent = "Loading Objects...";
        objectDetector = await ObjectDetector.createFromOptions(vision, {
          baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" },
          scoreThreshold: settings.objThreshold, runningMode: "VIDEO"
        });
        console.log("Objects loaded");
      } catch (e) { console.error("Objects load fail", e); }

      status.textContent = "Models ready — starting camera";
      await startCamera();
    }

    async function startCamera() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: settings.facingMode } });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          status.textContent = "Camera active — detecting... (check console)";
          running = true;
          predictLoop();
        };
      } catch (err) {
        status.textContent = "Camera error: " + err.message + "\nCheck Settings > Safari > Camera";
        console.error("Camera fail", err);
      }
    }

    function restartCamera() {
      running = false;
      setTimeout(startCamera, 500);
    }

    async function predictLoop() {
      if (!running) return;

      ctx.save();
      // Draw video flipped if front camera
      if (settings.facingMode === "user") {
        ctx.scale(-1, 1);
        ctx.translate(-canvas.width, 0);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      const startMs = performance.now();
      let detectionsFound = false;

      try {
        if (settings.faces && faceDetector) {
          const res = await faceDetector.detectForVideo(video, startMs);
          if (res.detections.length > 0) detectionsFound = true;
          for (const d of res.detections) {
            const box = d.boundingBox;
            ctx.strokeStyle = "#0066FF"; ctx.lineWidth = 3;
            ctx.strokeRect(box.originX, box.originY, box.width, box.height);
            ctx.fillStyle = "rgba(0,102,255,0.7)"; ctx.font = "16px Arial";
            ctx.fillText(`Face ${Math.round(d.confidence * 100)}%`, box.originX + 5, box.originY + 20);
          }
        }
      } catch (e) { console.error("Face detect error", e); }

      // ... (add similar try/catch for obj, pose, hand if you want full debug)

      if (!detectionsFound) {
        ctx.fillStyle = "#FFFF00"; ctx.font = "24px Arial";
        ctx.fillText("No detections — move closer / better light", 20, canvas.height - 40);
      }

      requestAnimationFrame(predictLoop);
    }

    initialize().catch(e => {
      status.textContent = "Init failed:\n" + e.message;
      console.error("Global init error", e);
    });
  </script>
</body>
</html>
