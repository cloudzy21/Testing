<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fast Person + Hand + Object Tracker (MediaPipe Tasks)</title>
  <style>
    body { margin:0; background:#000; font-family:Arial, sans-serif; color:#fff; }
    #container { position:relative; width:100vw; height:100vh; overflow:hidden; }
    #video, #canvas { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
    #canvas { pointer-events:none; }
    #status { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.5); padding:8px 12px; border-radius:6px; z-index:10; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="status">Loading models...</div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker,
      PoseLandmarker,
      ObjectDetector,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    let handLandmarker, poseLandmarker, objectDetector;
    let running = false;
    const drawingUtils = new DrawingUtils(ctx);

    // ── Init Models ───────────────────────────────────────────────────────────────
    async function initialize() {
      status.textContent = "Loading vision wasm...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      status.textContent = "Loading Hand model...";
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task` },
        runningMode: "VIDEO",
        numHands: 2
      });

      status.textContent = "Loading Pose model...";
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task` },
        runningMode: "VIDEO",
        numPoses: 2
      });

      status.textContent = "Loading Object Detector (COCO)...";
      objectDetector = await ObjectDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite` },
        scoreThreshold: 0.4,   // Tune for fewer false positives
        runningMode: "VIDEO"
      });

      status.textContent = "Models loaded! Starting camera...";
      await startCamera();
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }  // "environment" for back camera
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          status.textContent = "Ready — show hands & people!";
          running = true;
          predictLoop();
        };
      } catch (err) {
        status.textContent = "Camera error: " + err.message;
        console.error(err);
      }
    }

    async function predictLoop() {
      if (!running) return;

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Mirror if front camera
      ctx.scale(-1, 1);
      ctx.translate(-canvas.width, 0);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      const startTimeMs = performance.now();

      // ── Object Detection (boxes around people & items) ────────────────────────
      const objResults = await objectDetector.detectForVideo(video, startTimeMs);
      for (const detection of objResults.detections) {
        const box = detection.boundingBox;
        const cat = detection.categories[0];
        const label = `${cat.categoryName} ${Math.round(cat.score * 100)}%`;

        ctx.strokeStyle = "#00FF00";
        ctx.lineWidth = 3;
        ctx.strokeRect(box.originX, box.originY, box.width, box.height);

        ctx.fillStyle = "rgba(0,255,0,0.7)";
        ctx.font = "16px Arial";
        ctx.fillText(label, box.originX + 5, box.originY + 20);
      }

      // ── Pose (body skeleton) ──────────────────────────────────────────────────
      const poseResults = await poseLandmarker.detectForVideo(video, startTimeMs);
      for (const pose of poseResults.landmarks) {
        drawingUtils.drawLandmarks(pose, { color: "#FF0000", lineWidth: 2, radius: 4 });
        drawingUtils.drawConnectors(pose, PoseLandmarker.POSE_CONNECTIONS, { color: "#00FF88", lineWidth: 4 });
      }

      // ── Hands (detailed fingers) ──────────────────────────────────────────────
      const handResults = await handLandmarker.detectForVideo(video, startTimeMs);
      for (const landmarks of handResults.landmarks) {
        drawingUtils.drawLandmarks(landmarks, { color: "#FFDD00", lineWidth: 2, radius: 5 });
        drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, { color: "#00FFFF", lineWidth: 4 });
      }

      // Handedness labels (left/right)
      for (let i = 0; i < handResults.handedness.length; i++) {
        const h = handResults.handedness[i][0];
        const lm = handResults.landmarks[i][0]; // wrist
        const x = lm.x * canvas.width;
        const y = lm.y * canvas.height;
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "14px Arial";
        ctx.fillText(h.categoryName, x - 30, y - 10);
      }

      ctx.restore();
      requestAnimationFrame(predictLoop);
    }

    // Start everything
    initialize().catch(err => {
      status.textContent = "Init failed: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
