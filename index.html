<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MediaPipe Tracker – Side Menu</title>

<style>
:root{
  --bg:#0f0f1a;
  --panel:rgba(30,30,50,.78);
  --accent:#00d4ff;
  --text:#f0f4ff;
  --bottom-inset:env(safe-area-inset-bottom,34px);
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
  overflow:hidden;
}

#video,#canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
#canvas{pointer-events:none}

/* ────────── HUD ────────── */

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
}

.hud-card{
  background:rgba(20,20,40,.85);
  backdrop-filter:blur(10px);
  border-radius:10px;
  padding:8px 12px;
  font-size:13px;
  margin-bottom:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.6);
}

/* ────────── Side Menu Button ────────── */

#menu-btn{
  position:fixed;
  top:12px;
  right:12px;
  z-index:40;
  background:rgba(20,30,50,.9);
  border:1px solid rgba(0,212,255,.4);
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  font-size:14px;
  cursor:pointer;
  backdrop-filter:blur(10px);
}

/* ────────── Side Panel ────────── */

#controls-panel{
  position:fixed;
  top:0;
  right:0;
  height:100%;
  width:300px;
  background:var(--panel);
  backdrop-filter:blur(18px);
  border-left:1px solid rgba(0,212,255,.35);
  padding:18px;
  z-index:50;
  transform:translateX(100%);
  transition:transform .35s cubic-bezier(.2,.9,.3,1);
  overflow-y:auto;
}

#controls-panel.open{
  transform:translateX(0);
}

#controls-panel h3{
  margin-bottom:14px;
  font-size:18px;
}

label{
  display:flex;
  align-items:center;
  gap:10px;
  margin:10px 0;
  font-size:14px;
}

input[type=checkbox]{
  transform:scale(1.3);
  accent-color:var(--accent);
}

input[type=range]{
  width:100%;
  accent-color:var(--accent);
}

select{
  width:100%;
  padding:8px 10px;
  border-radius:8px;
  background:#1a1a2e;
  color:var(--text);
  border:1px solid #334466;
}

/* ────────── Status ────────── */

#status{
  position:fixed;
  bottom:calc(var(--bottom-inset) + 14px);
  left:50%;
  transform:translateX(-50%);
  background:rgba(20,20,40,.85);
  padding:10px 24px;
  border-radius:999px;
  font-size:14px;
  backdrop-filter:blur(12px);
  z-index:30;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud">
  <div class="hud-card">FPS: <b id="fps">--</b></div>
  <div class="hud-card">
    Objects: <b id="objCount">0</b> · Faces: <b id="faceCount">0</b><br>
    Hands: <b id="handCount">0</b> · Poses: <b id="poseCount">0</b>
  </div>
</div>

<button id="menu-btn">☰ Menu</button>

<div id="controls-panel">
  <h3>Tracker Controls</h3>

  <label><input type="checkbox" id="faceDetect" checked> Face boxes</label>
  <label><input type="checkbox" id="faceMesh" checked> Face mesh</label>
  <label><input type="checkbox" id="objDetect" checked> Objects</label>
  <label><input type="checkbox" id="poseLand" checked> Pose</label>
  <label><input type="checkbox" id="handLand" checked> Hands</label>
  <label><input type="checkbox" id="segment"> Segmentation</label>

  <hr style="margin:16px 0;border-color:#334466">

  <label>Camera
    <select id="camera">
      <option value="user">Front</option>
      <option value="environment">Back</option>
    </select>
  </label>

  <label>
    Detection confidence
    <input type="range" id="conf" min="30" max="70" value="50">
    <span id="confVal">0.50</span>
  </label>
</div>

<div id="status">Initializing…</div>

<script type="module">
import{
  FilesetResolver,
  HandLandmarker,
  PoseLandmarker,
  ObjectDetector,
  FaceDetector,
  FaceLandmarker,
  ImageSegmenter,
  DrawingUtils
}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const drawUtils=new DrawingUtils(ctx);

const fpsEl=document.getElementById("fps");
const objCount=document.getElementById("objCount");
const faceCount=document.getElementById("faceCount");
const handCount=document.getElementById("handCount");
const poseCount=document.getElementById("poseCount");
const status=document.getElementById("status");

const menuBtn=document.getElementById("menu-btn");
const panel=document.getElementById("controls-panel");

menuBtn.onclick=()=>panel.classList.toggle("open");

const state={
  faceDetect:true,
  faceMesh:true,
  objDetect:true,
  poseLand:true,
  handLand:true,
  segment:false,
  facingMode:"user",
  confidence:.5
};

document.querySelectorAll("input[type=checkbox]").forEach(el=>{
  el.onchange=()=>state[el.id]=el.checked;
});

document.getElementById("conf").oninput=e=>{
  state.confidence=e.target.value/100;
  document.getElementById("confVal").textContent=state.confidence.toFixed(2);
};

document.getElementById("camera").onchange=e=>{
  state.facingMode=e.target.value;
  startCamera();
};

let detectors={},running=false,last=0,frames=0;

async function init(){
  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  detectors.faceDetect=await FaceDetector.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"},
    runningMode:"VIDEO",minDetectionConfidence:state.confidence
  });

  detectors.faceMesh=await FaceLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
    runningMode:"VIDEO"
  });

  detectors.objDetect=await ObjectDetector.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite"},
    runningMode:"VIDEO",scoreThreshold:state.confidence
  });

  detectors.poseLand=await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"},
    runningMode:"VIDEO"
  });

  detectors.handLand=await HandLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},
    runningMode:"VIDEO"
  });

  detectors.segment=await ImageSegmenter.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmentation/float16/1/selfie_segmentation.tflite"},
    runningMode:"VIDEO",outputCategoryMask:true
  });

  startCamera();
}

async function startCamera(){
  if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());
  const stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:state.facingMode}
  });
  video.srcObject=stream;
  video.onloadedmetadata=()=>{
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    running=true;
    requestAnimationFrame(loop);
  };
}

async function loop(ts){
  if(!running)return;

  frames++;
  if(ts-last>1000){
    fpsEl.textContent=frames;
    frames=0;last=ts;
  }

  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const now=performance.now();

  if(state.faceDetect){
    const r=await detectors.faceDetect.detectForVideo(video,now);
    faceCount.textContent=r.detections.length;
  }

  requestAnimationFrame(loop);
}

init();
</script>

</body>
</html>
