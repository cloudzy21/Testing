<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dynamic Island Tracker</title>

<style>
:root{
  --bg:#0f0f1a;
  --panel:rgba(30,30,50,.78);
  --accent:#00d4ff;
  --text:#f0f4ff;

  --island-width:160px;
  --island-height:38px;
  --glow:22px;

  --bottom-inset:env(safe-area-inset-bottom,34px);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,system-ui,sans-serif;
  overflow:hidden;
}

#video,#canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
#canvas{pointer-events:none}

/* ---------- Dynamic Island ---------- */

#island-zone,
#island-outline{
  position:fixed;
  top:calc(env(safe-area-inset-top)/2 - var(--island-height)/2);
  left:50%;
  transform:translateX(-50%);
  width:var(--island-width);
  height:var(--island-height);
  border-radius:999px;
}

#island-zone{
  z-index:120;
}

#island-outline{
  z-index:110;
  pointer-events:none;
  border:2px solid var(--accent);
  opacity:.8;
  box-shadow:
    0 0 var(--glow) rgba(0,212,255,.55),
    inset 0 0 calc(var(--glow)/2) rgba(0,212,255,.45);
  transition:.4s ease;
}

#island-outline.menu-open{
  opacity:1;
  box-shadow:
    0 0 calc(var(--glow)*1.8) var(--accent),
    inset 0 0 var(--glow) rgba(0,212,255,.7);
}

#island-outline.hidden{
  opacity:0;
  transform:translateX(-50%) scale(.85);
}

/* ---------- Controls ---------- */

#controls{
  position:fixed;
  top:calc(env(safe-area-inset-top)/2 + 8px);
  right:10px;
  width:240px;
  background:var(--panel);
  backdrop-filter:blur(16px);
  border-radius:16px;
  padding:14px;
  box-shadow:0 12px 36px rgba(0,0,0,.7);
  transform:translateY(-20px) scale(.92);
  opacity:0;
  pointer-events:none;
  transition:.38s cubic-bezier(.2,.9,.3,1);
  z-index:100;
}

#controls.open{
  transform:translateY(0) scale(1);
  opacity:1;
  pointer-events:auto;
}

#controls h3{
  text-align:center;
  margin-bottom:10px;
}

label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  margin:8px 0;
}

input[type=checkbox]{
  transform:scale(1.2);
  accent-color:var(--accent);
}

input[type=range]{
  width:100%;
  accent-color:var(--accent);
}

/* ---------- Status ---------- */

#status{
  position:fixed;
  bottom:calc(var(--bottom-inset)+12px);
  left:50%;
  transform:translateX(-50%);
  background:rgba(20,20,40,.9);
  backdrop-filter:blur(12px);
  padding:8px 18px;
  border-radius:999px;
  font-size:14px;
  z-index:90;
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<div id="island-zone"></div>
<div id="island-outline"></div>

<div id="controls">
  <h3>Tracker</h3>
  <label><input type="checkbox" checked> Face detection</label>
  <label>Confidence
    <input type="range" id="conf" min="30" max="70" value="50">
    <span id="confVal">0.50</span>
  </label>
</div>

<div id="status">Initializing…</div>

<script type="module">
import {
  FilesetResolver,
  FaceDetector
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const islandZone = document.getElementById("island-zone");
const islandOutline = document.getElementById("island-outline");
const controls = document.getElementById("controls");
const status = document.getElementById("status");
const conf = document.getElementById("conf");
const confVal = document.getElementById("confVal");
const video = document.getElementById("video");

let menuOpen=false;
let lastSeenFace=0;
let fps=0,frames=0,last=performance.now();
let detector;

/* ---- Tap Dynamic Island ---- */
islandZone.onclick=()=>{
  menuOpen=!menuOpen;
  controls.classList.toggle("open",menuOpen);
  islandOutline.classList.toggle("menu-open",menuOpen);
  navigator.vibrate?.(10);
};

/* ---- Confidence ---- */
conf.oninput=e=>{
  confVal.textContent=(e.target.value/100).toFixed(2);
};

/* ---- Camera ---- */
navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(s=>video.srcObject=s);

/* ---- Init MediaPipe ---- */
const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);

detector = await FaceDetector.createFromOptions(vision,{
  baseOptions:{
    modelAssetPath:
    "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
  },
  runningMode:"VIDEO",
  minDetectionConfidence:.5
});

status.textContent="Ready";

/* ---- Main loop ---- */
function loop(ts){
  frames++;
  if(ts-last>1000){
    fps=frames;
    frames=0;
    last=ts;

    const glow=14+Math.min(30,fps*.6)+(conf.value/100)*20;
    document.documentElement.style.setProperty("--glow",glow+"px");
  }

  if(video.readyState>=2){
    const r=detector.detectForVideo(video,performance.now());
    if(r.detections.length){
      lastSeenFace=ts;
      islandOutline.classList.remove("hidden");
    }else if(ts-lastSeenFace>1500){
      islandOutline.classList.add("hidden");
      controls.classList.remove("open");
      menuOpen=false;
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
