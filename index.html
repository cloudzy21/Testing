<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MediaPipe Tracker – Fixed Mirroring & Minimizable Controls</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --panel: rgba(30, 30, 50, 0.7);
      --accent: #00d4ff;
      --text: #f0f4ff;
      --glow: rgba(0, 212, 255, 0.35);
    }
    body {
      margin:0; padding:0; background:var(--bg); color:var(--text);
      font-family:system-ui, -apple-system, sans-serif;
      overflow:hidden; touch-action:manipulation;
    }
    #video, #canvas {
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    }
    #canvas { pointer-events:none; }

    #hud {
      position:absolute; top:12px; left:12px; z-index:90;
      pointer-events:none;
    }
    .hud-card {
      background:rgba(20,20,40,0.75);
      backdrop-filter:blur(10px);
      border:1px solid rgba(100,180,255,0.25);
      border-radius:10px; padding:8px 12px;
      font-size:13px; margin-bottom:6px;
      box-shadow:0 3px 12px rgba(0,0,0,0.5);
    }

    #controls-wrapper {
      position:absolute; top:12px; right:12px; z-index:100;
    }
    #controls-toggle {
      width:48px; height:48px; border-radius:50%;
      background:var(--panel);
      backdrop-filter:blur(12px);
      border:1px solid rgba(0,212,255,0.4);
      color:var(--accent);
      font-size:24px; font-weight:bold;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; user-select:none;
      box-shadow:0 4px 16px rgba(0,0,0,0.6);
      transition: all 0.25s ease;
    }
    #controls-toggle:hover { transform:scale(1.08); }
    #controls-toggle.minimized { background:rgba(40,40,70,0.85); }

    #controls-panel {
      background:var(--panel);
      backdrop-filter:blur(16px);
      border:1px solid rgba(0,212,255,0.35);
      border-radius:16px;
      padding:16px 20px;
      margin-top:12px;
      width:260px;
      max-height:80vh; overflow-y:auto;
      box-shadow:0 10px 40px rgba(0,0,0,0.7);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #controls-panel.hidden {
      opacity:0;
      transform:translateY(-20px);
      pointer-events:none;
    }

    #controls-panel h3 { margin:0 0 14px; font-size:17px; }
    #controls-panel label {
      display:flex; align-items:center; gap:10px;
      margin:10px 0; font-size:14px; cursor:pointer;
    }
    input[type=checkbox] { transform:scale(1.35); accent-color:var(--accent); }
    input[type=range] { width:100%; accent-color:var(--accent); }
    select {
      padding:8px 12px; border-radius:8px;
      background:#1a1a2e; color:var(--text);
      border:1px solid #334466; width:100%;
    }

    #status {
      position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
      background:rgba(20,20,40,0.85); backdrop-filter:blur(12px);
      padding:10px 24px; border-radius:999px;
      border:1px solid rgba(0,180,255,0.3);
      font-size:15px; white-space:nowrap;
      transition:opacity 1.5s; pointer-events:none;
    }
    #status.faded { opacity:0; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-card">FPS: <b id="fps">--</b></div>
    <div class="hud-card">
      Objects: <b id="objCount">0</b> · Faces: <b id="faceCount">0</b><br>
      Hands: <b id="handCount">0</b> · Poses: <b id="poseCount">0</b>
    </div>
  </div>

  <div id="controls-wrapper">
    <div id="controls-toggle" onclick="toggleControls()">–</div>
    <div id="controls-panel">
      <h3>Tracker Controls</h3>

      <label><input type="checkbox" id="faceDetect" checked> Face boxes</label>
      <label><input type="checkbox" id="faceMesh" checked> Detailed face mesh</label>
      <label><input type="checkbox" id="objDetect" checked> Objects & people</label>
      <label><input type="checkbox" id="poseLand" checked> Body skeleton</label>
      <label><input type="checkbox" id="handLand" checked> Detailed hands</label>
      <label><input type="checkbox" id="segment"> Person mask overlay</label>

      <hr style="margin:16px 0; border-color:#334466;">

      <label>Camera
        <select id="camera">
          <option value="user">Front (selfie)</option>
          <option value="environment">Back</option>
        </select>
      </label>

      <label title="Lower = more detections, higher false positives">
        Detection confidence
        <input type="range" id="conf" min="30" max="70" value="50" step="1">
        <span id="confVal">0.50</span>
      </label>
    </div>
  </div>

  <div id="status">Initializing models…</div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker,
      PoseLandmarker,
      ObjectDetector,
      FaceDetector,
      FaceLandmarker,
      ImageSegmenter,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    let detectors = {};
    let running = false;
    const drawUtils = new DrawingUtils(ctx);

    const state = {
      faceDetect: true,
      faceMesh: true,
      objDetect: true,
      poseLand: true,
      handLand: true,
      segment: false,
      facingMode: "user",
      confidence: 0.50
    };

    // ── Controls toggle ───────────────────────────────────────────────────────
    function toggleControls() {
      const panel = document.getElementById("controls-panel");
      const toggleBtn = document.getElementById("controls-toggle");
      panel.classList.toggle("hidden");
      toggleBtn.textContent = panel.classList.contains("hidden") ? "+" : "–";
      toggleBtn.classList.toggle("minimized", panel.classList.contains("hidden"));
    }

    // Bind checkboxes & sliders
    document.querySelectorAll('#controls-panel input[type=checkbox]').forEach(el => {
      el.onchange = () => state[el.id] = el.checked;
    });

    document.getElementById("conf").oninput = e => {
      state.confidence = e.target.value / 100;
      document.getElementById("confVal").textContent = state.confidence.toFixed(2);
      updateDetectorOptions();
    };

    document.getElementById("camera").onchange = e => {
      state.facingMode = e.target.value;
      restartCamera();
    };

    async function initModels() {
      status.textContent = "Loading WASM & models…";

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      const conf = state.confidence;

      detectors.faceDetect = await FaceDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite" },
        runningMode: "VIDEO", minDetectionConfidence: conf
      });

      detectors.faceMesh = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
        runningMode: "VIDEO", numFaces: 3
      });

      detectors.objDetect = await ObjectDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" },
        scoreThreshold: conf, runningMode: "VIDEO"
      });

      detectors.poseLand = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" },
        runningMode: "VIDEO", numPoses: 2
      });

      detectors.handLand = await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
        runningMode: "VIDEO", numHands: 2
      });

      detectors.segment = await ImageSegmenter.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmentation/float16/1/selfie_segmentation.tflite" },
        runningMode: "VIDEO", outputCategoryMask: true
      });

      status.textContent = "Models loaded – opening camera";
      setTimeout(() => status.classList.add("faded"), 3500);
      startCamera();
    }

    async function startCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: state.facingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          status.textContent = "Tracking active";
          running = true;
          requestAnimationFrame(predictLoop);
        };
      } catch (err) {
        status.textContent = "Camera failed: " + err.message;
      }
    }

    function restartCamera() {
      running = false;
      setTimeout(startCamera, 400);
    }

    function updateDetectorOptions() {
      const c = state.confidence;
      detectors.faceDetect?.setOptions({ minDetectionConfidence: c });
      detectors.objDetect?.setOptions({ scoreThreshold: c });
      detectors.poseLand?.setOptions({ minPoseDetectionConfidence: c });
      detectors.handLand?.setOptions({ minHandDetectionConfidence: c, minTrackingConfidence: c });
    }

    let lastTs = 0, frameCt = 0;
    async function predictLoop(ts) {
      if (!running) return;

      frameCt++;
      if (ts - lastTs > 1000) {
        document.getElementById("fps").textContent = Math.round(frameCt * 1000 / (ts - lastTs));
        lastTs = ts; frameCt = 0;
      }

      const isMirrored = state.facingMode === "user";

      // Draw mirrored video if front cam
      ctx.save();
      if (isMirrored) {
        ctx.scale(-1, 1);
        ctx.translate(-canvas.width, 0);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      const now = performance.now();

      // ── All detections run on raw video (unmirrored) ───────────────────────
      // Then we mirror coordinates when drawing

      // Face boxes
      if (state.faceDetect && detectors.faceDetect) {
        const r = await detectors.faceDetect.detectForVideo(video, now);
        for (const d of r.detections) {
          let x = d.boundingBox.originX;
          let y = d.boundingBox.originY;
          let w = d.boundingBox.width;
          let h = d.boundingBox.height;

          if (isMirrored) x = canvas.width - (x + w);

          ctx.strokeStyle = "rgba(0,212,255,0.9)";
          ctx.lineWidth = 4;
          ctx.strokeRect(x, y, w, h);

          ctx.shadowColor = "rgba(0,212,255,0.7)";
          ctx.shadowBlur = 12;
          ctx.fillStyle = "rgba(0,40,60,0.7)";
          ctx.fillRect(x + 4, y + 4, 120, 26);
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 15px Arial";
          ctx.fillText(`Face ${(d.confidence*100)|0}%`, x + 10, y + 22);
        }
      }

      // Face mesh
      if (state.faceMesh && detectors.faceMesh) {
        const r = await detectors.faceMesh.detectForVideo(video, now);
        for (const lm of r.faceLandmarks) {
          const mirroredLm = lm.map(p => ({
            x: isMirrored ? 1 - p.x : p.x,
            y: p.y,
            z: p.z
          }));
          drawUtils.drawLandmarks(mirroredLm, { color: "#ffcc00", lineWidth: 1.5, radius: 2 });
          drawUtils.drawConnectors(mirroredLm, FaceLandmarker.FACE_CONNECTIONS, { color: "rgba(255,180,0,0.6)", lineWidth: 2.5 });
        }
      }

      // Objects
      if (state.objDetect && detectors.objDetect) {
        const r = await detectors.objDetect.detectForVideo(video, now);
        for (const d of r.detections) {
          let x = d.boundingBox.originX;
          let y = d.boundingBox.originY;
          let w = d.boundingBox.width;
          let h = d.boundingBox.height;

          if (isMirrored) x = canvas.width - (x + w);

          const cat = d.categories[0];
          const isPerson = cat.categoryName.toLowerCase().includes("person");
          ctx.strokeStyle = isPerson ? "#ff4d94" : "#00ff9d";
          ctx.lineWidth = 5;
          ctx.shadowColor = ctx.strokeStyle;
          ctx.shadowBlur = 15;
          ctx.strokeRect(x, y, w, h);
          ctx.shadowBlur = 0;

          ctx.fillStyle = "rgba(10,20,30,0.75)";
          ctx.fillRect(x + 6, y + 6, 140, 28);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 16px Arial";
          ctx.fillText(`${cat.categoryName} ${(cat.score*100)|0}%`, x + 12, y + 24);
        }
      }

      // Pose
      if (state.poseLand && detectors.poseLand) {
        const r = await detectors.poseLand.detectForVideo(video, now);
        for (const lm of r.landmarks) {
          const mirroredLm = lm.map(p => ({
            x: isMirrored ? 1 - p.x : p.x,
            y: p.y,
            z: p.z,
            visibility: p.visibility
          }));
          drawUtils.drawLandmarks(mirroredLm, { color: "#ff3366", lineWidth: 2.5, radius: 5 });
          drawUtils.drawConnectors(mirroredLm, PoseLandmarker.POSE_CONNECTIONS, { color: "#33ff99", lineWidth: 6 });
        }
      }

      // Hands
      if (state.handLand && detectors.handLand) {
        const r = await detectors.handLand.detectForVideo(video, now);
        for (let i = 0; i < r.landmarks.length; i++) {
          const lm = r.landmarks[i].map(p => ({
            x: isMirrored ? 1 - p.x : p.x,
            y: p.y,
            z: p.z,
            visibility: p.visibility,
            presence: p.presence
          }));

          drawUtils.drawLandmarks(lm, { color: "#ffff66", lineWidth: 2.5, radius: 6 });
          drawUtils.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, { color: "#00ffff", lineWidth: 6 });

          const handed = r.handedness[i]?.[0];
          if (handed) {
            const wrist = lm[0];
            const wx = wrist.x * canvas.width;
            const wy = wrist.y * canvas.height;
            ctx.shadowColor = "#00ffff";
            ctx.shadowBlur = 10;
            ctx.fillStyle = "#000000cc";
            ctx.fillRect(wx - 50, wy - 35, 100, 28);
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 15px Arial";
            ctx.textAlign = "center";
            ctx.fillText(handed.categoryName, wx, wy - 18);
            ctx.textAlign = "left";
          }
        }
      }

      // Segmentation
      if (state.segment && detectors.segment) {
        const r = await detectors.segment.segmentForVideo(video, now);
        if (r.categoryMask) {
          ctx.globalAlpha = 0.4;
          ctx.globalCompositeOperation = "screen";
          ctx.drawImage(r.categoryMask.getAsCanvasImageSource(), 0, 0, canvas.width, canvas.height);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
        }
      }

      requestAnimationFrame(predictLoop);
    }

    // ── Start ────────────────────────────────────────────────────────────────
    initModels().catch(err => {
      status.textContent = "Init failed: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
