<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dynamic Island Tracker</title>

<style>
:root {
  --bg: #0f0f1a;
  --panel: rgba(30,30,50,.78);
  --accent: #00d4ff;
  --text: #f0f4ff;

  --island-width: 160px;
  --island-height: 38px;
  --island-offset: -7px;

  --glow: 22px;
  --bottom-inset: env(safe-area-inset-bottom, 34px);
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system, system-ui, sans-serif;
  overflow:hidden;
}

#video, #canvas {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#canvas { pointer-events:none; }

/* ────────── Dynamic Island ────────── */

#island-zone,
#island-outline {
  position:fixed;
  top: calc(
    env(safe-area-inset-top) / 2
    - var(--island-height) / 2
    + var(--island-offset)
  );
  left:50%;
  transform:translateX(-50%);
  width:var(--island-width);
  height:var(--island-height);
  border-radius:999px;
}

#island-zone {
  z-index:120;
}

#island-outline {
  z-index:110;
  pointer-events:none;
  border:2px solid var(--accent);
  opacity:.85;
  box-shadow:
    0 0 var(--glow) rgba(0,212,255,.55),
    inset 0 0 calc(var(--glow)/2) rgba(0,212,255,.45);
  transition:.4s ease;
}

#island-outline.menu-open {
  opacity:1;
  box-shadow:
    0 0 calc(var(--glow)*1.8) var(--accent),
    inset 0 0 var(--glow) rgba(0,212,255,.75);
}

#island-outline.hidden {
  opacity:0;
  transform:translateX(-50%) scale(.85);
}

/* ────────── Controls ────────── */

#controls {
  position:fixed;
  top: calc(env(safe-area-inset-top) / 2 + 10px);
  right:10px;
  width:240px;
  background:var(--panel);
  backdrop-filter:blur(16px);
  border-radius:16px;
  padding:14px;
  box-shadow:0 12px 36px rgba(0,0,0,.7);
  transform:translateY(-20px) scale(.92);
  opacity:0;
  pointer-events:none;
  transition:.38s cubic-bezier(.2,.9,.3,1);
  z-index:100;
}

#controls.open {
  transform:translateY(0) scale(1);
  opacity:1;
  pointer-events:auto;
}

#controls h3 {
  text-align:center;
  margin-bottom:10px;
}

label {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  margin:8px 0;
}

input[type=checkbox] {
  transform:scale(1.2);
  accent-color:var(--accent);
}

input[type=range] {
  width:100%;
  accent-color:var(--accent);
}

/* ────────── Status ────────── */

#status {
  position:fixed;
  bottom:calc(var(--bottom-inset) + 12px);
  left:50%;
  transform:translateX(-50%);
  background:rgba(20,20,40,.9);
  backdrop-filter:blur(12px);
  padding:8px 18px;
  border-radius:999px;
  font-size:14px;
  z-index:90;
}

#hud {
  position:fixed;
  top: calc(env(safe-area-inset-top) + 8px);
  left:8px;
  z-index:90;
  pointer-events:none;
}

.hud-card {
  background:rgba(20,20,40,0.85);
  backdrop-filter:blur(10px);
  border-radius:10px;
  padding:6px 10px;
  font-size:12px;
  margin-bottom:6px;
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="island-zone"></div>
<div id="island-outline"></div>

<div id="controls">
  <h3>Tracker Controls</h3>
  <label><input type="checkbox" id="faceDetect" checked> Face boxes</label>
  <label><input type="checkbox" id="faceMesh" checked> Detailed face mesh</label>
  <label><input type="checkbox" id="objDetect" checked> Objects & people</label>
  <label><input type="checkbox" id="poseLand" checked> Body skeleton</label>
  <label><input type="checkbox" id="handLand" checked> Detailed hands</label>
  <label><input type="checkbox" id="segment"> Person mask overlay</label>

  <hr style="margin:16px 0;border-color:#334466">

  <label>Camera
    <select id="camera">
      <option value="user" selected>Front (selfie)</option>
      <option value="environment">Back</option>
    </select>
  </label>

  <label>
    Confidence
    <input type="range" id="conf" min="30" max="70" value="50">
    <span id="confVal">0.50</span>
  </label>
</div>

<div id="hud">
  <div class="hud-card">FPS: <b id="fps">--</b></div>
  <div class="hud-card">
    Faces: <b id="faceCount">0</b> · Objects: <b id="objCount">0</b><br>
    Hands: <b id="handCount">0</b> · Poses: <b id="poseCount">0</b>
  </div>
</div>

<div id="status">Initializing models…</div>

<script type="module">
import {
  FilesetResolver,
  FaceDetector,
  FaceLandmarker,
  ObjectDetector,
  PoseLandmarker,
  HandLandmarker,
  ImageSegmenter,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const draw = new DrawingUtils(ctx);

const fpsEl = document.getElementById("fps");
const faceCount = document.getElementById("faceCount");
const objCount = document.getElementById("objCount");
const handCount = document.getElementById("handCount");
const poseCount = document.getElementById("poseCount");
const status = document.getElementById("status");

const state = {
  faceDetect: true,
  faceMesh: true,
  objDetect: true,
  poseLand: true,
  handLand: true,
  segment: false,
  facingMode: "user",
  confidence: 0.5
};

document.getElementById("island-zone").onclick = () => {
  document.getElementById("controls").classList.toggle("open");
  document.getElementById("island-outline").classList.toggle("menu-open");
};

document.querySelectorAll("input[type=checkbox]").forEach(el => {
  el.onchange = () => state[el.id] = el.checked;
});

document.getElementById("camera").onchange = e => {
  state.facingMode = e.target.value;
  startCamera();
};

document.getElementById("conf").oninput = e => {
  state.confidence = e.target.value / 100;
  document.getElementById("confVal").textContent = state.confidence.toFixed(2);
};

let detectors = {};
let running = false;
let last = 0, frames = 0;

async function init() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  detectors.faceDetect = await FaceDetector.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite" },
    runningMode: "VIDEO"
  });

  detectors.faceMesh = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
    runningMode: "VIDEO"
  });

  detectors.objDetect = await ObjectDetector.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" },
    runningMode: "VIDEO"
  });

  detectors.poseLand = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" },
    runningMode: "VIDEO"
  });

  detectors.handLand = await HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
    runningMode: "VIDEO"
  });

  try {
    detectors.segment = await ImageSegmenter.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmentation/float16/latest/selfie_segmentation.tflite" },
      runningMode: "VIDEO",
      outputCategoryMask: true
    });
  } catch (e) {
    console.warn("Segmentation model failed to load:", e);
    state.segment = false;
  }

  startCamera();
}

async function startCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: state.facingMode }
  });
  video.srcObject = stream;

  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    running = true;
    status.textContent = "Tracking active";
    requestAnimationFrame(loop);
  };
}

function loop(ts) {
  frames++;
  if (ts - last > 1000) {
    fpsEl.textContent = frames;
    frames = 0;
    last = ts;
  }

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const now = performance.now();

  let f = 0, o = 0, h = 0, p = 0;

  if (state.faceDetect) {
    const r = detectors.faceDetect.detectForVideo(video, now);
    f = r.detections.length;
    for (const d of r.detections)
      ctx.strokeRect(d.boundingBox.originX, d.boundingBox.originY, d.boundingBox.width, d.boundingBox.height);
  }

  if (state.faceMesh) {
    const r = detectors.faceMesh.detectForVideo(video, now);
    r.faceLandmarks.forEach(l => {
      draw.drawLandmarks(l, {color:"#ffcc00", radius:1.5});
      draw.drawConnectors(l, FaceLandmarker.FACE_CONNECTIONS, {color:"#ffaa00"});
    });
  }

  if (state.objDetect) {
    const r = detectors.objDetect.detectForVideo(video, now);
    o = r.detections.length;
    r.detections.forEach(d => {
      ctx.strokeStyle="#00ff9d";
      ctx.lineWidth=4;
      ctx.strokeRect(d.boundingBox.originX, d.boundingBox.originY, d.boundingBox.width, d.boundingBox.height);
    });
  }

  if (state.poseLand) {
    const r = detectors.poseLand.detectForVideo(video, now);
    p = r.landmarks.length;
    r.landmarks.forEach(l => {
      draw.drawLandmarks(l, {color:"#ff3366"});
      draw.drawConnectors(l, PoseLandmarker.POSE_CONNECTIONS, {color:"#33ff99"});
    });
  }

  if (state.handLand) {
    const r = detectors.handLand.detectForVideo(video, now);
    h = r.landmarks.length;
    r.landmarks.forEach(l => {
      draw.drawLandmarks(l, {color:"#ffff66"});
      draw.drawConnectors(l, HandLandmarker.HAND_CONNECTIONS, {color:"#00ffff"});
    });
  }

  if (state.segment && detectors.segment) {
    const r = detectors.segment.segmentForVideo(video, now);
    if (r.categoryMask) {
      ctx.globalAlpha = .35;
      ctx.drawImage(r.categoryMask.getAsCanvasImageSource(), 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
    }
  }

  faceCount.textContent = f;
  objCount.textContent = o;
  handCount.textContent = h;
  poseCount.textContent = p;

  requestAnimationFrame(loop);
}

init();
</script>

</body>
</html>
