<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Real-Time Tracker - Fixed</title>
  <style>
    body { margin:0; padding:0; background:#000; font-family:Arial, sans-serif; color:#fff; overflow:hidden; }
    #container { position:relative; width:100vw; height:100vh; }
    #video, #canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #canvas { pointer-events:none; }
    #controls {
      position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.65); padding:16px; border-radius:12px;
      z-index:100; font-size:15px; min-width:220px; max-width:280px; box-shadow:0 4px 15px rgba(0,0,0,0.6);
    }
    #controls label { display:block; margin:10px 0; user-select:none; }
    #controls select, #controls input[type=range] { width:100%; margin-top:4px; }
    #status {
      position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.7); padding:10px 14px;
      border-radius:8px; z-index:90; font-size:14px; max-width:80%; white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="controls">
      <strong>Tracker Controls</strong>
      <label><input type="checkbox" id="faceOn" checked> Face detection</label>
      <label><input type="checkbox" id="objOn" checked> Objects & people boxes</label>
      <label><input type="checkbox" id="poseOn" checked> Body skeleton</label>
      <label><input type="checkbox" id="handOn" checked> Hand tracking</label>
      <label>Camera:
        <select id="cameraMode">
          <option value="user">Front (selfie)</option>
          <option value="environment">Back</option>
        </select>
      </label>
      <div style="margin-top:12px; font-size:13px; opacity:0.9;">
        Tip: Good lighting + move closer if nothing shows
      </div>
    </div>
    <div id="status">Starting up...</div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker,
      PoseLandmarker,
      ObjectDetector,
      FaceDetector,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    let handLandmarker, poseLandmarker, objectDetector, faceDetector;
    let running = false;
    const drawingUtils = new DrawingUtils(ctx);

    const settings = {
      faces: true,
      objects: true,
      pose: true,
      hands: true,
      facingMode: "user"
    };

    // UI bindings
    document.getElementById("faceOn").onchange = e => settings.faces = e.target.checked;
    document.getElementById("objOn").onchange = e => settings.objects = e.target.checked;
    document.getElementById("poseOn").onchange = e => settings.pose = e.target.checked;
    document.getElementById("handOn").onchange = e => settings.hands = e.target.checked;
    document.getElementById("cameraMode").onchange = e => {
      settings.facingMode = e.target.value;
      restartCamera();
    };

    async function initModels() {
      status.textContent = "Loading models...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      faceDetector = await FaceDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite" },
        runningMode: "VIDEO",
        minDetectionConfidence: 0.55
      });

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
        runningMode: "VIDEO",
        numHands: 2
      });

      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" },
        runningMode: "VIDEO",
        numPoses: 1
      });

      objectDetector = await ObjectDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" },
        scoreThreshold: 0.45,
        runningMode: "VIDEO"
      });

      status.textContent = "Models loaded — opening camera";
    }

    async function startCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: settings.facingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 },
            aspectRatio: { ideal: 16/9 }
          }
        });

        video.srcObject = stream;
        await new Promise(resolve => {
          video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            resolve();
          };
        });

        status.textContent = "Camera ready — tracking started";
        running = true;
        requestAnimationFrame(predictLoop);
      } catch (err) {
        status.textContent = "Camera failed:\n" + err.message + "\nCheck Safari → Settings → Camera";
      }
    }

    function restartCamera() {
      running = false;
      setTimeout(startCamera, 400);
    }

    async function predictLoop() {
      if (!running) return;

      // Draw video (mirrored if front camera)
      ctx.save();
      if (settings.facingMode === "user") {
        ctx.scale(-1, 1);
        ctx.translate(-canvas.width, 0);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      const now = performance.now();

      // Face
      if (settings.faces && faceDetector) {
        const res = await faceDetector.detectForVideo(video, now);
        for (const d of res.detections) {
          const box = d.boundingBox;
          ctx.strokeStyle = "#00aaff"; ctx.lineWidth = 4;
          ctx.strokeRect(box.originX, box.originY, box.width, box.height);
          ctx.fillStyle = "#00aaff"; ctx.font = "18px Arial";
          ctx.fillText(`Face ${(d.confidence*100).toFixed(0)}%`, box.originX + 8, box.originY + 28);
        }
      }

      // Objects / people
      if (settings.objects && objectDetector) {
        const res = await objectDetector.detectForVideo(video, now);
        for (const d of res.detections) {
          const box = d.boundingBox;
          const label = d.categories[0].categoryName;
          const score = (d.categories[0].score * 100).toFixed(0);
          ctx.strokeStyle = label.includes("person") ? "#ff3366" : "#33ff66";
          ctx.lineWidth = 4;
          ctx.strokeRect(box.originX, box.originY, box.width, box.height);
          ctx.fillStyle = ctx.strokeStyle; ctx.font = "18px Arial";
          ctx.fillText(`${label} ${score}%`, box.originX + 8, box.originY + 28);
        }
      }

      // Pose (body)
      if (settings.pose && poseLandmarker) {
        const res = await poseLandmarker.detectForVideo(video, now);
        for (const lm of res.landmarks) {
          drawingUtils.drawLandmarks(lm, { color: "#ff0000", lineWidth: 2, radius: 5 });
          drawingUtils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: "#00ff88", lineWidth: 5 });
        }
      }

      // Hands
      if (settings.hands && handLandmarker) {
        const res = await handLandmarker.detectForVideo(video, now);
        for (const lm of res.landmarks) {
          drawingUtils.drawLandmarks(lm, { color: "#ffff00", lineWidth: 2, radius: 6 });
          drawingUtils.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, { color: "#00ffff", lineWidth: 5 });
        }
      }

      requestAnimationFrame(predictLoop);
    }

    // Start everything
    initModels().then(startCamera).catch(err => {
      status.textContent = "Startup failed:\n" + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
